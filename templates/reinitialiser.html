<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GestPME — Nouveau mot de passe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <h1>GestPME</h1>
            <p>Choisissez un nouveau mot de passe</p>

            {% if erreur %}
                <p class="erreur">{{ erreur }}</p>
            {% endif %}

            {% if token %}
                <form method="POST" action="/reinitialiser/{{ token }}">
                    <div class="form-group">
                        <label>Nouveau mot de passe</label>
                        <input type="password" name="nouveau_mot_de_passe"
                               placeholder="Minimum 8 caractères" minlength="8" required autofocus>
                    </div>
                    <div class="form-group">
                        <label>Confirmer le mot de passe</label>
                        <input type="password" name="confirmation"
                               placeholder="Répétez le mot de passe" minlength="8" required>
                    </div>
                    <button type="submit">Enregistrer le nouveau mot de passe</button>
                </form>
            {% else %}
                <div style="text-align:center; margin-top:16px;">
                    <a href="/mot-de-passe-oublie" class="retour-login">Demander un nouveau lien</a>
                </div>
            {% endif %}

            <a href="/login" class="retour-login">← Retour à la connexion</a>
        </div>
    </div>
</body>
</html>

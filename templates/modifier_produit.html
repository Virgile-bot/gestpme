<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GestPME — Modifier produit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-dashboard">
    <header class="topbar">
        <div class="topbar-logo">GestPME</div>
        <div class="topbar-user">
            <a href="/stocks" class="btn-logout">← Retour</a>
        </div>
    </header>
    <main class="contenu">
        <h1>Modifier le produit</h1>
        <p>Mettez à jour les informations de ce produit</p>

        <div class="form-card">
            <form method="POST" action="/stocks/mettre_a_jour/{{ produit.id }}">
                <div class="form-section">Informations produit</div>
                <div class="form-group">
                    <label>Nom du produit</label>
                    <input type="text" name="nom" value="{{ produit.nom }}" required>
                </div>
                <div class="form-group">
                    <label>Catégorie</label>
                    <input type="text" name="categorie" value="{{ produit.categorie }}" required>
                </div>

                <div class="form-section">Prix</div>
                <div class="form-group">
                    <label>Prix d'achat unitaire (FCFA)</label>
                    <input type="number" name="prix_achat" step="0.01" min="0" value="{{ produit.prix_achat }}" required>
                </div>
                <div class="form-group">
                    <label>Prix de vente unitaire (FCFA)</label>
                    <input type="number" name="prix_unitaire" step="0.01" min="0" value="{{ produit.prix_unitaire }}" required>
                </div>

                <div class="form-section">Stock</div>
                <div class="form-group">
                    <label>Quantité en stock</label>
                    <input type="number" name="quantite_stock" min="0" value="{{ produit.quantite_stock }}" required>
                </div>
                <div class="form-group">
                    <label>Seuil d'alerte</label>
                    <input type="number" name="seuil_alerte" min="0" value="{{ produit.seuil_alerte }}" required>
                </div>

                <button type="submit">Mettre à jour</button>
            </form>
        </div>
    </main>
</body>
</html>

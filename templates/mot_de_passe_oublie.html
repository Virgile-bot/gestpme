<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GestPME — Mot de passe oublié</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <h1>GestPME</h1>
            <p>Réinitialisation du mot de passe</p>

            {% if message %}
                <div style="background:#E3EFE6; color:#1B4332; padding:12px 14px; border-radius:6px; border-left:3px solid #1B4332; font-size:13px; margin-bottom:16px;">
                    ✓ {{ message }}
                </div>
                <a href="/login" class="retour-login">← Retour à la connexion</a>
            {% else %}
                <form method="POST" action="/mot-de-passe-oublie">
                    <div class="form-group">
                        <label>Votre adresse email</label>
                        <input type="email" name="email" placeholder="votre@email.com" required autofocus>
                    </div>
                    <button type="submit">Envoyer le lien de réinitialisation</button>
                </form>
                <a href="/login" class="retour-login">← Retour à la connexion</a>
            {% endif %}
        </div>
    </div>
</body>
</html>

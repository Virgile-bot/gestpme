<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GestPME — Créer un compte</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="inscription-wrap">
        <div class="inscription-card">
            <h1>GestPME</h1>
            <p class="sous-titre">Créer le compte de votre entreprise</p>

            {% if erreur %}
                <p class="erreur">{{ erreur }}</p>
            {% endif %}

            <form method="POST" action="/inscription">
                <div class="inscription-section">Informations de l'entreprise</div>

                <div class="form-group">
                    <label>Nom de l'entreprise</label>
                    <input type="text" name="nom_entreprise" placeholder="Ex: Épicerie Kouassi & Frères" required>
                </div>
                <div class="form-group">
                    <label>IFU (Identifiant Fiscal Unique)</label>
                    <input type="text" name="ifu" placeholder="Ex: BJ2026000123" required>
                </div>
                <div class="form-group">
                    <label>Téléphone</label>
                    <input type="text" name="telephone" placeholder="+229...">
                </div>
                <div class="form-group">
                    <label>Adresse</label>
                    <input type="text" name="adresse" placeholder="Ex: Marché Dantokpa, Cotonou">
                </div>

                <div class="inscription-section">Compte du gérant</div>

                <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" name="nom_complet" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" name="mot_de_passe" required minlength="8">
                </div>

                <button type="submit">Créer mon compte</button>
            </form>

            <a href="/login" class="retour-login">J'ai déjà un compte — Se connecter</a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GestPME — Créer un compte</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="inscription-wrap">
        <div class="inscription-card">
            <h1>GestPME</h1>
            <p class="sous-titre">Créer le compte de votre entreprise</p>

            {% if erreur %}
                <p class="erreur">{{ erreur }}</p>
            {% endif %}

            <form method="POST" action="/inscription">
                <div class="inscription-section">Informations de l'entreprise</div>

                <div class="form-group">
                    <label>Nom de l'entreprise</label>
                    <input type="text" name="nom_entreprise" placeholder="Ex: Épicerie Kouassi & Frères" required>
                </div>
                <div class="form-group">
                    <label>IFU (Identifiant Fiscal Unique)</label>
                    <input type="text" name="ifu" id="ifu-input"
                           placeholder="Ex: IFU3200800176115 ou 3200800176115"
                           maxlength="16"
                           autocomplete="off"
                           required>
                    <div id="ifu-feedback" style="font-size:12px; margin-top:6px; min-height:16px;"></div>
                    <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">
                        Format : IFU + 13 chiffres · Vérifiez votre IFU sur
                        <a href="https://ifu.impots.bj/ifu-search" target="_blank"
                           style="color:var(--accent);">ifu.impots.bj</a>
                    </div>
                </div>
                <div class="form-group">
                    <label>Téléphone</label>
                    <input type="text" name="telephone" placeholder="+229...">
                </div>
                <div class="form-group">
                    <label>Adresse</label>
                    <input type="text" name="adresse" placeholder="Ex: Marché Dantokpa, Cotonou">
                </div>

                <div class="inscription-section">Compte du gérant</div>

                <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" name="nom_complet" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" name="mot_de_passe" required minlength="8">
                </div>

                <div class="form-group" style="display:flex; align-items:flex-start; gap:10px; margin-top:20px;">
                    <input type="checkbox" name="cgu_acceptees" id="cgu-check" required
                           style="width:auto; margin-top:3px; accent-color:var(--green); cursor:pointer;">
                    <label for="cgu-check" style="text-transform:none; font-weight:400; font-size:13px; color:var(--t2); margin:0; cursor:pointer;">
                        J'ai lu et j'accepte les
                        <a href="/cgu" target="_blank" style="color:var(--green);">Conditions Générales d'Utilisation</a>
                        et la
                        <a href="/confidentialite" target="_blank" style="color:var(--green);">Politique de Confidentialité</a>
                        de GestPME.
                    </label>
                </div>

                <button type="submit">Créer mon compte</button>
            </form>

            <a href="/login" class="retour-login">J'ai déjà un compte — Se connecter</a>
        </div>
    </div>

    <script>
    const ifuInput = document.getElementById('ifu-input');
    const feedback = document.getElementById('ifu-feedback');

    function validerIFU(ifu) {
        ifu = ifu.trim().toUpperCase().replace(/[\s\-]/g, '');

        if (!ifu) return { ok: false, msg: '' };

        let chiffres = ifu;
        if (ifu.startsWith('IFU')) {
            chiffres = ifu.slice(3);
        }

        if (!/^\d+$/.test(chiffres)) {
            return { ok: false, msg: "❌ L'IFU ne doit contenir que des chiffres après 'IFU'." };
        }

        if (chiffres.length < 13) {
            return { ok: false, msg: `❌ Il manque ${13 - chiffres.length} chiffre(s). IFU incomplet.` };
        }

        if (chiffres.length > 13) {
            return { ok: false, msg: `❌ Trop de chiffres (${chiffres.length}). L'IFU doit avoir 13 chiffres.` };
        }

        const ifuFormate = ifu.startsWith('IFU') ? ifu : `IFU${ifu}`;
        return { ok: true, msg: `✓ Format IFU valide — ${ifuFormate}`, ifu: ifuFormate };
    }

    ifuInput.addEventListener('input', function() {
        const result = validerIFU(this.value);
        if (!result.msg) {
            feedback.textContent = '';
            return;
        }
        feedback.textContent = result.msg;
        feedback.style.color = result.ok ? 'var(--accent)' : 'var(--color-red-400)';

        // Auto-compléter avec le préfixe IFU
        if (result.ok && result.ifu) {
            this.value = result.ifu;
        }
    });

    // Validation avant soumission
    ifuInput.closest('form').addEventListener('submit', function(e) {
        const result = validerIFU(ifuInput.value);
        if (!result.ok) {
            e.preventDefault();
            feedback.textContent = result.msg || "❌ Veuillez entrer un IFU valide.";
            feedback.style.color = 'var(--color-red-400)';
            ifuInput.focus();
        }
    });
    </script>
</body>
</html>
